<!DOCTYPE html>
<html>
  
  <body style="background-image: url(./Wallpaper2.jpg); background-size: cover; background-repeat: no-repeat; background-position: center; background-attachment: fixed; font-family: Arial, sans-serif, Helvetica, Noto Sans">
    


    <div style="display: flex; justify-content: space-between; align-items: center; position: absolute; width: 100%; display: flex; background-color: rgba(26, 61, 92, 0.2); color: #a34514"; background-blur: 10px>

      <p style="margin-left: 15px; font-weight: 600; background-color: rgba(7, 50, 87, 0.911); padding: 5px 10px; border-radius: 5px;">Root Directive</p>

      <p id = "openWelcomeWindow" style="cursor: pointer; margin-right: 15px; font-weight: 600; background-color: rgba(7, 50, 87, 0.911); padding: 5px 10px; border-radius: 5px; margin-left: auto;">Welcome</p>

      <p id="timeElement" style="margin-right: 15px; font-weight: 600; background-color: rgba(7, 50, 87, 0.911); padding: 5px 10px; border-radius: 5px;">6/24/26 4:46 PM</p>

    </div>



    <div id="welcomeWindow" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: solid; width: 1200px; margin: auto; padding: 0px;  background-color: #ffffff; border-radius: 5px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.247); border-color:#000000; display: flex; flex-direction: column; align-items: center;">
      
      <div id="welcomeWindowheader" style="background-color: #073257; padding: 5px; cursor: move; display: flex; width: calc(100% - 10px); align-items: center; justify-content: space-between;">
      
        <p style="color:#000000; padding: 0px; margin: 0px; font-size: 10px; font-weight: 600;">

          Welcome

        </p>
      
        <p id="closeWelcomeWindow" style="cursor: pointer; padding: 0px; margin: 0px; font-size: 20px; font-weight: 600; color: #dd500e;">

          x

        </p>

      </div>
      
      <img style="border-radius: 50%; object-fit: cover; width: 100px;" src="./CodeSymbol.png" />

      <h1 style="padding: 4px; margin: 4px;">Welcome to Root Directive</h1>

      <p>Root Directive is a interactive puzzle game where you (the user) must use the tools available from the OS to solve the puzzles and find the code to the vault.</p>
    </div>

    
    <script>
      setInterval(function () {
        document.querySelector("#timeElement").innerHTML = new Date().toLocaleString();}, 1000);
    </script>

    <script src="script.js"></script>

  </body>

</html>
